<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 거래 메모장</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#111827}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top a{color:#2563eb;text-decoration:none;font-size:14px}
h1{font-size:20px;margin:0}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:#6b7280;display:block;margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
.full{grid-column:1/3}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border:1px solid #d1d5db;background:#fff;border-radius:8px;font-size:15px;cursor:pointer}
.seg button.buy.on{background:#ef4444;color:#fff;border-color:#ef4444}
.seg button.sell.on{background:#2563eb;color:#fff;border-color:#2563eb}
.add{width:100%;margin-top:12px;padding:12px;background:#111827;color:#fff;border:0;border-radius:10px;font-size:16px;cursor:pointer}
.total{font-size:13px;color:#6b7280;margin-top:8px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid #f0f0f0}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:#6b7280;font-weight:600;font-size:12px}
.b{color:#ef4444;font-weight:700}.s{color:#2563eb;font-weight:700}
.x{background:none;border:0;color:#9ca3af;cursor:pointer;font-size:16px}
.empty{text-align:center;color:#9ca3af;padding:20px}
.tools{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
.hint{font-size:12px;color:#6b7280}
.tools button{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.tblwrap{overflow-x:auto}
h2{font-size:15px;margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← 홈</a><h1>📒 주식 거래 메모장</h1><span style="width:40px"></span></div>

  <div class="card">
    <div class="row">
            <div class="full"><label>종목</label><input type="text" id="name" placeholder="예: 삼성전자"></div>
      <div><label>거래 단가 (원)</label><input type="number" id="price" inputmode="numeric"></div>
      <div><label>거래 수량 (주)</label><input type="number" id="qty" inputmode="numeric"></div>
    </div>
    <div class="total" id="sum">거래금액: -</div>
    <div id="msg" style="min-height:20px;margin-top:6px;font-size:13px;text-align:center"></div>
    <button class="add" id="addBtn">매수 기록하기</button>
  </div>

  <div class="card">
    <div class="tools"><span class="hint">매수하면 기록하고, 매도하면 ✕로 삭제하세요.</span><button id="csv">엑셀(CSV)로 저장</button></div>
    <div class="tblwrap"><table>
      <thead><tr><th>날짜</th><th>종목</th><th>단가</th><th>수량</th><th>금액</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table></div>
  </div>

  <div class="card"><h2>종목별 보유 현황</h2>
    <div class="tblwrap"><table>
      <thead><tr><th>종목</th><th>보유수량</th><th>평균 매수단가</th></tr></thead>
      <tbody id="hold"></tbody>
    </table></div>
    <div style="font-size:11px;color:#9ca3af;margin-top:8px">이 기기의 브라우저에만 저장돼요. 다른 기기와는 공유되지 않아요.</div>
  </div>
</div>
<script>
const KEY='stockTradeMemo.v1';
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
function safeSet(v){try{localStorage.setItem(KEY,v)}catch(e){}}
const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function msg(t,c){const m=$('msg');m.textContent=t;m.style.color=c||'#ef4444';clearTimeout(msg.t);msg.t=setTimeout(()=>{m.textContent=''},3000)}
function save(){safeSet(JSON.stringify(data))}
function upSum(){const p=+$('price').value,q=+$('qty').value;$('sum').textContent='거래금액: '+(p>0&&q>0?won(p*q)+'원':'-')}
$('price').oninput=upSum;$('qty').oninput=upSum;
$('addBtn').onclick=()=>{
  const name=$('name').value.trim(),price=+$('price').value,qty=+$('qty').value,date=today();
  if(!name||!(price>0)||!(qty>0)){msg('종목, 단가, 수량을 모두 입력해 주세요.');return}
  data.push({id:Date.now(),date,name,price,qty});save();
  $('name').value='';$('price').value='';$('qty').value='';upSum();render();msg('기록했어요!','#16a34a');
};
let pend=null;
function del(id){if(pend===id){data=data.filter(x=>x.id!==id);pend=null;save();render();msg('삭제했어요.','#6b7280')}else{pend=id;render();msg('한 번 더 누르면 삭제돼요. (매도했을 때만!)','#6b7280')}}
function render(){
  const rows=[...data].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('list').innerHTML=rows.length?rows.map(x=>'<tr><td>'+esc(x.date.slice(2))+'</td><td>'+esc(x.name)+'</td><td>'+won(x.price)+'</td><td>'+won(x.qty)+'</td><td>'+won(x.price*x.qty)+'</td><td><button class="x" data-id="'+x.id+'" style="'+(pend===x.id?'color:#ef4444;font-size:12px;font-weight:700':'')+'">'+(pend===x.id?'삭제?':'✕')+'</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">아직 기록이 없어요</td></tr>';
  document.querySelectorAll('.x').forEach(b=>b.onclick=()=>del(+b.dataset.id));
  const h={};
  data.forEach(x=>{const o=h[x.name]||(h[x.name]={q:0,cost:0});o.q+=x.qty;o.cost+=x.price*x.qty});
  const hs=Object.entries(h).filter(([,o])=>o.q>0);
  $('hold').innerHTML=hs.length?hs.map(([n,o])=>'<tr><td>'+esc(n)+'</td><td>'+won(o.q)+'주</td><td>'+won(o.cost/o.q)+'원</td></tr>').join(''):'<tr><td colspan="3" class="empty">보유 종목이 없어요</td></tr>';
}
$('csv').onclick=()=>{
  if(!data.length){msg('저장할 기록이 없어요.');return}
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=['날짜,종목,단가,수량,금액',...[...data].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,q(x.name),x.price,x.qty,x.price*x.qty].join(','))];
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='주식거래기록.csv';a.click();
};
render();
</script>
</body>
</html>
